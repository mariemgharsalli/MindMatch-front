<div class="container-fluid">

  <!-- Header -->
  <div class="conference-header-box d-flex justify-content-start align-items-center mb-4">
    <i class="fas fa-calendar-alt me-2 icon-box"></i>
    <h5 class="m-0 text-white">Manage Conferences</h5>
  </div>

  <!-- Create Form -->
  <div class="card shadow mb-4 conference-content">
    <div class="card-header py-3 d-flex justify-content-between align-items-center">
      <h6 class="m-0 font-weight-bold text-primary">
        <i class="fas fa-plus-circle me-2"></i>New Conference
      </h6>
    </div>
    <div class="card-body">
      <form (ngSubmit)="createConference()" #confForm="ngForm">
        <div class="row mb-3">
          <div class="col-md-6">
            <div class="form-group">
              <label for="title" class="form-label"><i class="fas fa-heading me-2 text-teal"></i>Title</label>
              <input type="text" id="title" class="form-control" [(ngModel)]="newConference.title" name="title" required
                placeholder="Conference title">
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="location" class="form-label"><i
                  class="fas fa-map-marker-alt me-2 text-orange"></i>Location</label>
              <input type="text" id="location" class="form-control" [(ngModel)]="newConference.location" name="location"
                required placeholder="Conference location">
            </div>
          </div>
        </div>

        <div class="row mb-3">
          <div class="col-md-6">
            <div class="form-group">
              <label for="date" class="form-label"><i class="fas fa-calendar me-2 text-blue"></i>Date</label>
              <input type="date" id="date" class="form-control" [(ngModel)]="newConference.date" name="date" required>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-group">
              <label for="duration" class="form-label"><i class="fas fa-clock me-2 text-indigo"></i>Duration</label>
              <input type="time" id="duration" class="form-control" [(ngModel)]="newConference.duration" name="duration"
                required>
            </div>
          </div>
        </div>

        <div class="form-group mb-3">
          <label for="description" class="form-label"><i
              class="fas fa-align-left me-2 text-green"></i>Description</label>
          <textarea id="description" class="form-control" [(ngModel)]="newConference.description" name="description"
            rows="3" placeholder="Description"></textarea>
        </div>

        <div class="d-flex justify-content-start">
          <button type="submit" class="btn btn-success">
            <i class="fas fa-plus me-2"></i>Add
          </button>
          <button type="button" class="btn btn-secondary ms-2" (click)="resetForm()">
            <i class="fas fa-times me-2"></i>Cancel
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- Toggle Conference List -->
  <div class="d-flex justify-content-start mb-4">
    <button class="btn"
      style="background-color: #371a6c; color: white; font-weight: 500; border-radius: 5px; padding: 8px 16px; border: none; box-shadow: 0 2px 5px rgba(0,0,0,0.1);"
      (click)="toggleConferenceList()">
      <i class="fas fa-{{ isConferenceListVisible ? 'eye-slash' : 'eye' }} me-2"></i>
      {{ isConferenceListVisible ? 'Hide Conference List' : 'Show Conference List' }}
    </button>
  </div>

  <!-- Conference List -->
  <div *ngIf="isConferenceListVisible" class="card shadow mb-4 conference-content">
    <div class="card-header py-3">
      <h6 class="m-0 font-weight-bold text-primary"><i class="fas fa-list me-2"></i>Conference List</h6>
    </div>
    <div class="card-body">
      <div class="table-responsive">
        <table class="table table-striped table-hover" width="100%" cellspacing="0">
          <thead>
            <tr>
              <th><i class="fas fa-id-badge text-purple me-2"></i>ID</th>
              <th><i class="fas fa-heading text-teal me-2"></i>Title</th>
              <th><i class="fas fa-map-marker-alt text-orange me-2"></i>Location</th>
              <th><i class="fas fa-calendar text-blue me-2"></i>Date</th>
              <th><i class="fas fa-clock text-indigo me-2"></i>Duration</th>
              <th><i class="fas fa-align-left text-green me-2"></i>Description</th>
              <th><i class="fas fa-cogs text-primary me-2"></i>Actions</th>

            </tr>
          </thead>
          <tbody>
            <ng-container *ngFor="let conf of conferences">
              <tr *ngIf="editingConferenceId !== conf.conferenceId">
                <td>{{ conf.conferenceId }}</td>
                <td>{{ conf.title }}</td>
                <td>{{ conf.location }}</td>
                <td>{{ conf.date | date:'dd/MM/yyyy' }}</td>
                <td>{{ conf.duration }}</td>
                <td>{{ conf.description }}</td>
                <td>
                  <a href="javascript:void(0)" class="text-warning me-2" title="Edit" (click)="startEdit(conf)">
                    <i class="fas fa-edit"></i>
                  </a>
                  <a href="javascript:void(0)" class="text-danger me-2" title="Delete"
                    (click)="deleteConference(conf.conferenceId!)">
                    <i class="fas fa-trash"></i>
                  </a>
                </td>


              </tr>

              <tr *ngIf="editingConferenceId === conf.conferenceId">
                <td colspan="7">
                  <form (ngSubmit)="updateConference()">
                    <div class="row mb-2">
                      <div class="col">
                        <input type="text" class="form-control" [(ngModel)]="editingConference.title" name="editTitle"
                          required placeholder="Title">
                      </div>
                      <div class="col">
                        <input type="text" class="form-control" [(ngModel)]="editingConference.location"
                          name="editLocation" required placeholder="Location">
                      </div>
                    </div>
                    <div class="row mb-2">
                      <div class="col">
                        <input type="date" class="form-control" [(ngModel)]="editingConference.date" name="editDate"
                          required>
                      </div>
                      <div class="col">
                        <input type="time" class="form-control" [(ngModel)]="editingConference.duration"
                          name="editDuration" required>
                      </div>
                    </div>
                    <div class="form-group mb-2">
                      <textarea class="form-control" [(ngModel)]="editingConference.description" name="editDescription"
                        rows="2" placeholder="Description"></textarea>
                    </div>
                    <div class="d-flex">
                      <button type="submit" class="btn btn-primary me-2">Save</button>
                      <button type="button" class="btn btn-secondary" (click)="cancelEdit()">Cancel</button>
                    </div>
                  </form>
                </td>
              </tr>

            </ng-container>
          </tbody>
        </table>
      </div>
    </div>
  </div>


</div>
