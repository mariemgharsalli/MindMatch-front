<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments Management</title>
    <link href="/assets/BackOffice/vendor/fontawesome-free/css/all.min.css" rel="stylesheet" type="text/css">
    <link href="https://fonts.googleapis.com/css?family=Nunito:200,200i,300,300i,400,400i,600,600i,700,700i,800,800i,900,900i"
        rel="stylesheet">
    <link href="/assets/BackOffice/css/sb-admin-2.min.css" rel="stylesheet">
    <style>
        /* Style global pour la page */
        body {
            font-family: 'Nunito', sans-serif;
            background-color: #fef5f9;
            color: #333;
        }

        /* Style de la barre de recherche */
        .search-container {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            margin-bottom: 20px;
        }

        .search-container input {
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #f1d0d6;
            font-size: 1rem;
            width: 300px;
        }

        .search-container button {
            padding: 10px 20px;
            margin-left: 10px;
            background-color: #f8c9e5;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
        }

        .search-container button:hover {
            background-color: #f48fb1;
        }

        /* Style de la table avec icônes */
        .table th, .table td {
            padding: 15px;
            text-align: left;
            font-size: 1rem;
        }

        .table .icon-column {
            width: 30px;
        }

        .table .icon-column i {
            color: #f48fb1; /* Couleur rose clair */
        }

        .table .icon-column i:hover {
            color: #f8c9e5;
        }

        .table thead {
            background-color: #f8c9e5;
            color: white;
        }

        .table tbody tr:hover {
            background-color: #f1d0d6;
        }

        /* Style des badges */
        .badge-success {
            background-color: #a5d6a7; /* Vert clair */
            color: white;
        }

        .badge-danger {
            background-color: #f8bbd0; /* Rose très clair */
            color: white;
        }

        .badge-info {
            background-color: #80deea; /* Bleu clair */
            color: white;
        }

        /* Style du graphique */
        #paymentChart {
            background-color: #ffffff;
            border-radius: 5px;
        }

        /* Titre du graphique */
        h3 {
            color: #f48fb1;
            font-size: 1.8rem;
            font-weight: 700;
            text-align: center;
            margin-top: 30px;
        }
    </style>
</head>

<body id="page-top">
    <div id="wrapper">
        <div id="content-wrapper" class="d-flex flex-column">
            <div id="content">
                <app-navebar-back></app-navebar-back>
                <div class="container-fluid">
                    <!-- Barre de recherche -->
                    <div class="search-container">
                        <input type="text" placeholder="Search payments..." />
                        <button>Search</button>
                    </div>

                    <div class="card shadow mb-4">
                        <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                            <h6 class="m-0 font-weight-bold text-primary">Payments Management</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" width="100%" cellspacing="0">
                                    <thead class="thead-light">
                                        <tr>
                                            <th>#</th>
                                            <th>Amount <i class="fas fa-dollar-sign"></i></th>
                                            <th>Sessions <i class="fas fa-calendar-day"></i></th>
                                            <th>Status <i class="fas fa-check-circle"></i></th>
                                            <th>Created At <i class="fas fa-clock"></i></th>
                                        </tr>
                                    </thead>
                                    <tbody>
                                        <tr *ngIf="isLoading">
                                            <td colspan="8" class="text-center">
                                                <div class="spinner-border text-primary" role="status">
                                                    <span class="sr-only">Loading...</span>
                                                </div>
                                            </td>
                                        </tr>
                                        <tr *ngFor="let payment of payments; let index = index">
                                            <td>{{ index + 1 }}</td>
                                            <td>{{ payment.amount }}</td>
                                            <td>{{ payment.titles.join(', ') }}</td>
                                            <td><span
                                                    [ngClass]="payment.status === PaymentStatus.COMPLETED ? 'badge badge-success' : payment.status === PaymentStatus.CANCELLED ? 'badge badge-danger' : 'badge badge-info'">{{ payment.status }}</span>
                                            </td>
                                            <td>{{ payment.createdAt | date:'short' }}</td>
                                        </tr>
                                        <tr *ngIf="payments.length === 0 && !isLoading">
                                            <td colspan="10" class="text-center">No payments found.</td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <h3>Graphique des paiements par mois</h3>
        <!-- Canvas pour dessiner le graphique -->
        <canvas id="paymentChart" width="800" height="400"></canvas>
    </div>
    
    <script src="/assets/BackOffice/vendor/jquery/jquery.min.js"></script>
    <script src="/assets/BackOffice/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="/assets/BackOffice/vendor/jquery-easing/jquery.easing.min.js"></script>
    <script src="/assets/BackOffice/js/sb-admin-2.min.js"></script>
    <script src="/assets/BackOffice/vendor/chart.js/Chart.min.js"></script>
    <script>
        // Exemple d'initialisation du graphique pour les paiements par jour
        const ctx = document.getElementById('paymentChart').getContext('2d');
        const paymentChart = new Chart(ctx, {
            type: 'polarArea',  // Graphique en ligne
            data: {
                labels: ['2025-04-01', '2025-04-02', '2025-04-03', '2025-04-04', '2025-04-05'],  // Dates
                datasets: [{
                    label: 'Total Payments per Day',
                    data: [200, 500, 300, 700, 150],  // Montants des paiements par jour
                    backgroundColor: 'rgba(244, 143, 177, 0.2)',
                    borderColor: '#f48fb1',
                    borderWidth: 2,
                    tension: 0.4
                }]
            },
            options: {
                responsive: true,
                scales: {
                    x: {
                        title: {
                            display: true,
                            text: 'Date'
                        }
                    },
                    y: {
                        title: {
                            display: true,
                            text: 'Total Payments'
                        },
                        beginAtZero: true
                    }
                }
            }
        });
    </script>
</body>

</html>
