<div class="calendar-wrapper">
    <button class="toggle-calendar-btn" (click)="toggleCalendar()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="currentColor" viewBox="0 0 16 16">
        <path d="M3.5 0a.5.5 0 0 1 .5.5V1h8V.5a.5.5 0 0 1 1 0V1h1a2 2 0 0 1 2 2v11a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3a2 2 0 0 1 2-2h1V.5a.5.5 0 0 1 .5-.5zM1 4v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V4H1z"/>
      </svg>
      <span>Voir le calendrier</span>
    </button>
  
    <div *ngIf="isOpen" class="calendar-container" @fadeIn>
      <div class="calendar-header">
        <button class="nav-button" (click)="prevMonth()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M11.354 1.646a.5.5 0 0 1 0 .708L5.707 8l5.647 5.646a.5.5 0 0 1-.708.708l-6-6a.5.5 0 0 1 0-.708l6-6a.5.5 0 0 1 .708 0z"/>
          </svg>
        </button>
        <h2>{{ getMonthYearString() }}</h2>
        <button class="nav-button" (click)="nextMonth()">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" viewBox="0 0 16 16">
            <path fill-rule="evenodd" d="M4.646 1.646a.5.5 0 0 1 .708 0l6 6a.5.5 0 0 1 0 .708l-6 6a.5.5 0 0 1-.708-.708L10.293 8 4.646 2.354a.5.5 0 0 1 0-.708z"/>
          </svg>
        </button>
      </div>
  
      <div class="calendar-grid">
        <div class="day-header" *ngFor="let dayName of dayNames">
          {{ dayName }}
        </div>
  
        <div *ngFor="let week of weeks" class="calendar-week">
          <div *ngFor="let day of week" 
               class="calendar-day"
               [class.has-session]="day.hasSession"
               [class.today]="day.isToday"
               [class.selected]="day.isSelected"
               [class.empty]="!day.day"
               (click)="selectDay(day)">
            <div class="day-number">{{ day.day }}</div>
            <div *ngIf="day.hasSession" class="session-indicator">
              <span *ngIf="day.sessionCount > 0">{{ day.sessionCount }}</span>
            </div>
          </div>
        </div>
      </div>
  
      <div class="calendar-legend">
        <div class="legend-item">
          <div class="legend-color today"></div>
          <span>Aujourd'hui</span>
        </div>
        <div class="legend-item">
          <div class="legend-color has-session"></div>
          <span>Sessions</span>
        </div>
        <div class="legend-item">
          <div class="legend-color selected"></div>
          <span>Sélectionné</span>
        </div>
      </div>
    </div>
  </div>
