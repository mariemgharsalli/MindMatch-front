<div class="stats-container">
  <div class="stats-header d-flex justify-content-between align-items-center">
    <div>
      <h2><i class="fas fa-chart-bar"></i> Conference Statistics</h2>
      <p>Monthly conference analysis</p>
    </div>
    <button class="btn btn-outline-primary" (click)="refreshConferences()" title="Refresh statistics">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </div>

  <div class="stats-content">
    <div class="chart-container">
      <canvas baseChart
              [data]="barChartData"
              [options]="barChartOptions"
              chartType="bar">
      </canvas>
    </div>

    <div class="stats-summary">
      <div class="summary-card">
        <i class="fas fa-calendar-alt"></i>
        <h3>Total Conferences</h3>
        <p>{{ getTotalConferences() }}</p>
      </div>
      <div class="summary-card">
        <i class="fas fa-chart-line"></i>
        <h3>Most Active Month</h3>
        <p>{{ getMostActiveMonth() }}</p>
      </div>
    </div>
  </div>
</div>
